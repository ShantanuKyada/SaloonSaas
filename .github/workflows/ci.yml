name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # Throwaway values for CI only. Production secrets never live in the repository.
  NODE_ENV: development
  DATABASE_URL: postgres://salon_app:ci-app-password@localhost:5432/salon_dev
  DATABASE_MIGRATION_URL: postgres://salon_owner:ci-owner-password@localhost:5432/salon_dev
  DATABASE_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
  TEST_DATABASE_URL: postgres://salon_app:ci-app-password@localhost:5432/salon_test
  TEST_DATABASE_MIGRATION_URL: postgres://salon_owner:ci-owner-password@localhost:5432/salon_test
  JWT_ACCESS_SECRET: ci-only-jwt-secret-0123456789-0123456789-abcdef
  PUBLIC_LINK_SECRET: ci-only-link-secret-0123456789-0123456789-abcd
  DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  NOTIFICATIONS_MODE: console
  APP_BASE_URL: http://localhost:5173
  API_BASE_URL: http://localhost:4000
  CORS_ORIGINS: http://localhost:5173

jobs:
  verify:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Create database roles and databases
        run: npm run db:setup
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies must have no high or critical findings)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Tests sign in many times from one address.
      RATE_LIMIT_MULTIPLIER: "50"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare and seed the database
        run: |
          npm run db:setup
          npm run db:migrate
          npm run db:seed
      - name: Run the end-to-end tests (Playwright starts the API and web servers)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  images:
    name: Build container images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          tags: salonos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          tags: salonos-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Single-host production stack: PostgreSQL, one-shot migrations, API, worker and the web front end.
#   cp deploy/.env.example deploy/.env      # fill in every value
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# TLS is terminated in front of the `web` service (see docs/DEPLOYMENT.md). For a managed PostgreSQL service, delete the
# `db` service, point DB_HOST at it and drop DATABASE_SUPERUSER_URL (the roles are then created by your infrastructure).

name: salonos

x-api: &api
  image: salonos-api:${TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.api
  restart: unless-stopped
  environment: &api-env
    NODE_ENV: production
    PORT: "4000"
    LOG_LEVEL: ${LOG_LEVEL:-info}
    APP_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required, e.g. https://salon.example.com}
    API_BASE_URL: ${PUBLIC_URL}
    CORS_ORIGINS: ${PUBLIC_URL}
    TRUST_PROXY: ${TRUST_PROXY:-2}
    DATABASE_URL: postgres://${DB_APP_USER:-salon_app}:${DB_APP_PASSWORD:?}@${DB_HOST:-db}:5432/${DB_NAME:-salon}
    DATABASE_MIGRATION_URL: postgres://${DB_OWNER_USER:-salon_owner}:${DB_OWNER_PASSWORD:?}@${DB_HOST:-db}:5432/${DB_NAME:-salon}
    DB_APP_ROLE: ${DB_APP_USER:-salon_app}
    DB_SSL: ${DB_SSL:-false}
    DB_POOL_MAX: ${DB_POOL_MAX:-10}
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
    PUBLIC_LINK_SECRET: ${PUBLIC_LINK_SECRET:?}
    DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
    METRICS_TOKEN: ${METRICS_TOKEN:?}
    NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-live}
    WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
    WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
    WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published: only the other containers need it. Use `docker compose exec db psql -U postgres` for admin work.

  migrate:
    <<: *api
    restart: "no"
    command: ["sh", "-c", "node dist/db/setup.js && node dist/db/migrate.js"]
    environment:
      <<: *api-env
      DATABASE_SUPERUSER_URL: postgres://postgres:${POSTGRES_PASSWORD}@${DB_HOST:-db}:5432/postgres
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["4000"]

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: salonos-web:${TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  pgdata:
